name: 同步 Release 到 Gitee

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: '要同步的 GitHub Release tag（留空取最新）'
        required: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 确定 Release tag
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.event.release.tag_name }}"
          fi
          if [ -z "$TAG" ]; then
            TAG=$(gh release view --repo "${{ github.repository }}" --json tagName --jq .tagName)
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "同步 Release: $TAG"

      - name: 下载 GitHub Release 资产
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-assets
          gh release download "${{ steps.rel.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --dir release-assets \
            --pattern '*.exe'
          ls -lh release-assets

      - name: 创建或复用 Gitee Release
        id: gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          TAG="${{ steps.rel.outputs.tag }}"
          EXIST=$(curl -s --max-time 60 \
            "https://gitee.com/api/v5/repos/iloveaimer/YuGiOh-Card/releases/tags/${TAG}?access_token=${GITEE_TOKEN}")
          ID=$(python3 -c 'import json,sys; d=json.loads(sys.argv[1]); print(d.get("id","") if isinstance(d,dict) else "")' "$EXIST")
          if [ -n "$ID" ]; then
            echo "复用已有 Gitee Release: id=$ID"
          else
            NOTE=$(curl -s -X GET \
              "https://api.github.com/repos/${{ github.repository }}/releases/tags/${TAG}" \
              -H 'Accept: application/vnd.github+json' \
              | python3 -c 'import json,sys; print(json.load(sys.stdin).get("body") or "")')
            BODY=$(python3 -c 'import json,sys; print(json.dumps({"access_token":sys.argv[1],"tag_name":sys.argv[2],"name":sys.argv[2],"body":sys.argv[3],"target_commitish":"main"},ensure_ascii=False))' "$GITEE_TOKEN" "$TAG" "$NOTE")
            RESP=$(curl -s --max-time 60 -X POST \
              'https://gitee.com/api/v5/repos/iloveaimer/YuGiOh-Card/releases' \
              -H 'Content-Type: application/json;charset=UTF-8' \
              -d "$BODY")
            ID=$(python3 -c 'import json,sys; d=json.loads(sys.argv[1]); print(d.get("id","") if isinstance(d,dict) else "")' "$RESP")
            if [ -z "$ID" ]; then
              echo "::error::Gitee Release 创建失败: $RESP"
              exit 1
            fi
            echo "Gitee Release 已创建: id=$ID"
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: 上传资产到 Gitee Release
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          ID="${{ steps.gitee.outputs.id }}"
          for asset in release-assets/*.exe; do
            NAME=$(basename "$asset")
            EXISTING=$(curl -s --max-time 60 \
              "https://gitee.com/api/v5/repos/iloveaimer/YuGiOh-Card/releases/${ID}?access_token=${GITEE_TOKEN}" \
              | python3 -c 'import json,sys; d=json.load(sys.stdin); print(any(a.get("name")==sys.argv[1] for a in d.get("assets",[])))' "$NAME")
            if [ "$EXISTING" = "True" ]; then
              echo "已存在，跳过: $NAME"
              continue
            fi
            echo "上传 $NAME"
            RESP=$(curl -sS --max-time 1800 --retry 3 --retry-delay 10 -X POST \
              "https://gitee.com/api/v5/repos/iloveaimer/YuGiOh-Card/releases/${ID}/attach_files" \
              -F "access_token=${GITEE_TOKEN}" \
              -F "file=@${asset}")
            python3 -c 'import json,sys; d=json.loads(sys.argv[1]); assert isinstance(d,dict) and d.get("id"), "上传失败: "+sys.argv[1]' "$RESP"
            echo "已上传: $NAME"
          done
